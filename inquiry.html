<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry - EcoTech Solutions</title>
</head>
<body>

    <header>
        <h1>Make an Inquiry</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="services.html">Services</a> |
            <a href="products.html">Products</a> |
            <a href="locations.html">Locations</a> |
            <a href="inquiry.html">Inquiry</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <h2>Inquiry Form</h2>

        <p>
            Complete the form below to make an inquiry about
            our products or services.
        </p>

        <form action="#" method="post">

            <label for="name">Full Name:</label>
            <br>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email Address:</label>
            <br>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="phone">Phone Number:</label>
            <br>
            <input type="tel" id="phone" name="phone">
            <br><br>

            <label for="interest">Product or Service:</label>
            <br>

            <select id="interest" name="interest" required>

                <option value="">Select an option</option>

                <option>IT Support</option>
                <option>Website Development</option>
                <option>Device Recycling</option>
                <option>Computer Refurbishment</option>
                <option>Refurbished Laptop</option>
                <option>Refurbished Desktop</option>
                <option>Eco Accessories</option>
                <option>Eco-Friendly Electronics</option>

            </select>

            <br><br>

            <label for="message">Message:</label>
            <br>

            <textarea
                id="message"
                name="message"
                rows="7"
                cols="40"
                required>
            </textarea>

            <br><br>

            <button type="submit">Submit Inquiry</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 EcoTech Solutions.</p>
    </footer>

</body>
</html>
